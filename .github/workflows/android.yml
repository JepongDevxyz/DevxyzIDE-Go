name: Build APK

on:
  push:
    branches: [devxyz-go-phase0]
    # Pushes that only touch workflow files (e.g. deleting the 18 inherited
    # upstream workflows one by one via the web UI) must not start a build
    # each time. Code pushes still trigger normally; workflow_dispatch
    # remains available for manual runs.
    paths-ignore:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  IDE_SIGNING_KEY_BIN: ${{ secrets.IDE_SIGNING_KEY_BIN }}
  IDE_SIGNING_STORE_PASS: ${{ secrets.IDE_SIGNING_STORE_PASS }}
  IDE_SIGNING_KEY_PASS: ${{ secrets.IDE_SIGNING_KEY_PASS }}
  IDE_SIGNING_ALIAS: ${{ secrets.IDE_SIGNING_ALIAS }}
  GLITCHTIP_DSN: "" # keep empty: Sentry/GlitchTip inert

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No setup-android action: the GitHub runner image already ships the
      # Android SDK (ANDROID_HOME) with cmdline-tools, and
      # android-actions/setup-android@v3 fails on current images because it
      # tries to install the removed legacy "tools" package
      # ("Failed to find package 'tools'", run 41105613543). Use the
      # preinstalled sdkmanager directly instead.
      - name: Install SDK packages (platform 36 + NDK)
        run: |
          SDKMANAGER="$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools" "ndk;29.0.14206865"
        # NDK version = BuildConfig.NDK_VERSION; large download — cache if slow.
        # build-tools 35.0.0 is AGP 8.8.2's default; 36.0.0 kept for compileSdk 36.

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            # No secret configured: write a minimal dummy file for package
            # com.jepongdevxyz.go so the google-services plugin passes.
            # Firebase Analytics no-ops at runtime with these fake values.
            printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"devxyzide-go","storage_bucket":"devxyzide-go.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"dummy","android_client_info":{"package_name":"com.jepongdevxyz.go"}},"oauth_client":[],"api_key":[{"current_key":"dummy-not-a-real-key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi
        # REQUIRED until/unless the google-services plugin is removed.

      - name: Prepare signing (throwaway CI key when secrets are absent)
        run: |
          if [ -z "$IDE_SIGNING_KEY_BIN" ]; then
            # The debug-signing fallback path fails in validateSigning
            # (run 41108512821: ':app:validateSigningV8Debug' >
            # org/bouncycastle/asn1/edec/EdECObjectIdentifiers), while the
            # "common" config path — used whenever a real keystore is
            # configured — is the one upstream CI always exercises.
            # Until Jepong sets the repo's IDE_SIGNING_* secrets (her real
            # release key), sign CI builds with a throwaway key generated
            # fresh in this run. APKs from different runs then have
            # different signatures and cannot update-install over each
            # other; that is expected for smoke builds.
            # PKCS12 note: store password and key password MUST be the same
            # (PKCS12 protects the key with the store password; keytool
            # ignores a distinct -keypass). Run 41171289313 failed at
            # :app:packageV8Debug with "Get Key failed: Given final block
            # not properly padded" because they differed.
            keytool -genkeypair -keystore "$RUNNER_TEMP/ci-signing.p12" -storetype PKCS12 \
              -alias ci -storepass ci-sign-pass -keypass ci-sign-pass \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=DevxyzIDE Go CI, O=Jepong Devxyz"
            echo "IDE_SIGNING_KEY_BIN=$(base64 -w0 "$RUNNER_TEMP/ci-signing.p12")" >> "$GITHUB_ENV"
            echo "IDE_SIGNING_ALIAS=ci" >> "$GITHUB_ENV"
            echo "IDE_SIGNING_STORE_PASS=ci-sign-pass" >> "$GITHUB_ENV"
            echo "IDE_SIGNING_KEY_PASS=ci-sign-pass" >> "$GITHUB_ENV"
            echo "Signing: throwaway CI key (repo IDE_SIGNING_* secrets not set yet)."
          else
            echo "Signing: repo IDE_SIGNING_* secrets."
          fi

      - name: Install advancecomp (advzip for recompressApk)
        run: command -v advzip || { sudo apt-get update && sudo apt-get install -y advancecomp; }

      # Assets: on GitHub Actions (GITHUB_ACTIONS=true → isCiCd in
      # app/build.gradle.kts) the assemble tasks deliberately do NOT depend
      # on assetsDownload* — upstream's own CI runs them explicitly first.
      # Without assetsDownloadRelease, run 41172702158 failed the release
      # build at :app:quickBuildBundledDistGate (gradle-9.6.1-bin.zip.br
      # absent). So both invocations run their download task first
      # (checksum-verified; a no-op when files are already current).
      # Memory budget for the 16 GB GitHub-hosted runner: upstream's
      # gradle.properties assumes self-hosted infra (daemon 8G + Kotlin
      # daemon 8G + aapt2 daemon 8G + 30 workers). Run 41169832898 died with
      # the Gradle CLIENT hitting OutOfMemoryError while reading a giant
      # log event from the daemon (the --stacktrace report of the real
      # failure), so: no --stacktrace, a real heap for the client via
      # GRADLE_OPTS, and scaled-down daemon/Kotlin/aapt2/worker budgets.
      - name: Build v8 debug APK
        env:
          GRADLE_OPTS: "-Xmx3g"
        run: |
          set -o pipefail
          ./gradlew :app:assetsDownloadDebug :app:assembleV8Debug --no-daemon -Dorg.gradle.jvmargs="-Xmx6g" -Dkotlin.daemon.jvm.options="-Xmx3g" -Dorg.gradle.workers.max=8 -Pandroid.aapt2.daemonHeapSize=2048M 2>&1 | tee "$RUNNER_TEMP/gradle-debug.log"
        # Asset downloads (dev-assets R2) are pulled in by the task graph.
        # Output is tee'd to a file so the failure extract below can pull the
        # exact error block without downloading the full multi-hundred-MB
        # Actions log archive (those downloads kept getting interrupted).

      - name: Build v8 release APK
        env:
          GRADLE_OPTS: "-Xmx3g"
        run: |
          set -o pipefail
          ./gradlew :app:assetsDownloadRelease :app:assembleV8Release --no-daemon -Dorg.gradle.jvmargs="-Xmx6g" -Dkotlin.daemon.jvm.options="-Xmx3g" -Dorg.gradle.workers.max=8 -Pandroid.aapt2.daemonHeapSize=2048M -Pnext_release_version=26.44 2>&1 | tee "$RUNNER_TEMP/gradle-release.log"
        # next_release_version is mandatory for release (YY.ww format).
        # Signed with her key when the IDE_SIGNING_* secrets are set;
        # without them the build only warns and debug-signs (smoke builds).

      - name: Publish failure extract
        if: failure()
        run: |
          OUT="$RUNNER_TEMP/failure-extract.txt"
          {
            echo "# DevxyzIDE Go — CI failure extract"
            echo "## java: $(java -version 2>&1 | head -1)"
            echo "## signing keystore check:"
            keytool -list -keystore "$RUNNER_TEMP/ci-signing.p12" -storetype PKCS12 -storepass ci-sign-pass 2>&1 | head -8 || echo "(no CI keystore — repo secrets path was used)"
            for f in "$RUNNER_TEMP"/gradle-*.log; do
              [ -f "$f" ] || continue
              echo ""
              echo "===== $f ====="
              grep -m3 "Signing info\|IDE_SIGNING" "$f" || true
              grep -m5 "Execution failed for task" "$f" || true
              grep -A 60 "FAILURE: Build failed with an exception" "$f" | head -120 || true
              grep -m10 "Caused by:" "$f" || true
              echo "--- context around first validateSigning mention ---"
              grep -B2 -A12 -m1 "validateSigning" "$f" || true
            done
          } > "$OUT" 2>&1 || true
          cat "$OUT"
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure extract
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-extract
          path: ${{ runner.temp }}/failure-extract.txt
          if-no-files-found: warn

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzIDE-Go-APKs
          path: |
            app/build/outputs/apk/v8/debug/*.apk
            app/build/outputs/apk/v8/release/*.apk
          if-no-files-found: error

      - name: Cleanup google-services.json
        if: always()
        run: rm -f app/google-services.json
