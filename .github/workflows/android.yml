name: Build APK

on:
  push:
    branches: [devxyz-go-phase0]
  workflow_dispatch:

permissions:
  contents: read

env:
  IDE_SIGNING_KEY_BIN: ${{ secrets.IDE_SIGNING_KEY_BIN }}
  IDE_SIGNING_STORE_PASS: ${{ secrets.IDE_SIGNING_STORE_PASS }}
  IDE_SIGNING_KEY_PASS: ${{ secrets.IDE_SIGNING_KEY_PASS }}
  IDE_SIGNING_ALIAS: ${{ secrets.IDE_SIGNING_ALIAS }}
  GLITCHTIP_DSN: "" # keep empty: Sentry/GlitchTip inert

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No setup-android action: the GitHub runner image already ships the
      # Android SDK (ANDROID_HOME) with cmdline-tools, and
      # android-actions/setup-android@v3 fails on current images because it
      # tries to install the removed legacy "tools" package
      # ("Failed to find package 'tools'", run 41105613543). Use the
      # preinstalled sdkmanager directly instead.
      - name: Install SDK packages (platform 36 + NDK)
        run: |
          SDKMANAGER="$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools" "ndk;29.0.14206865"
        # NDK version = BuildConfig.NDK_VERSION; large download — cache if slow.
        # build-tools 35.0.0 is AGP 8.8.2's default; 36.0.0 kept for compileSdk 36.

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            # No secret configured: write a minimal dummy file for package
            # com.jepongdevxyz.go so the google-services plugin passes.
            # Firebase Analytics no-ops at runtime with these fake values.
            printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"devxyzide-go","storage_bucket":"devxyzide-go.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"dummy","android_client_info":{"package_name":"com.jepongdevxyz.go"}},"oauth_client":[],"api_key":[{"current_key":"dummy-not-a-real-key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi
        # REQUIRED until/unless the google-services plugin is removed.

      - name: Install advancecomp (advzip for recompressApk)
        run: command -v advzip || { sudo apt-get update && sudo apt-get install -y advancecomp; }

      - name: Build v8 debug APK
        run: ./gradlew :app:assembleV8Debug --no-daemon -Dorg.gradle.jvmargs="-Xmx8g"
        # Asset downloads (dev-assets R2) are pulled in by the task graph.

      - name: Build v8 release APK
        run: ./gradlew :app:assembleV8Release --no-daemon -Pnext_release_version=26.44 -Dorg.gradle.jvmargs="-Xmx8g"
        # next_release_version is mandatory for release (YY.ww format).
        # Signed with her key when the IDE_SIGNING_* secrets are set;
        # without them the build only warns and debug-signs (smoke builds).

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzIDE-Go-APKs
          path: |
            app/build/outputs/apk/v8/debug/*.apk
            app/build/outputs/apk/v8/release/*.apk
          if-no-files-found: error

      - name: Cleanup google-services.json
        if: always()
        run: rm -f app/google-services.json
